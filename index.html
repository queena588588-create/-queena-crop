<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queena 智慧批次剪裁 v4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;--bg:#0e1117;--card:#171b24;--line:#2c3340;--accent:#8b6cff;--txt:#fff;--sub:#b9c1ce}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt)}.wrap{max-width:900px;margin:auto;padding:18px}
h1{font-size:27px;margin:4px 0 8px}p{color:var(--sub);line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.pick,button{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700}.pick{display:flex;justify-content:center;background:#fff;color:#111;cursor:pointer}input[type=file]{display:none}
.modes,.ratios{display:grid;gap:9px;margin-top:12px}.modes{grid-template-columns:repeat(2,1fr)}.ratios{grid-template-columns:repeat(5,1fr)}
.opt{background:#11151d;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;font-weight:700;cursor:pointer}.opt.active{background:var(--accent)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{background:var(--accent);color:#fff;cursor:pointer}button.alt{background:#28303c}button:disabled{opacity:.45}
.tip{background:#10151d;border:1px solid #303848;border-radius:12px;padding:12px;color:#d7dce5;line-height:1.5;font-size:14px}.status{min-height:22px;margin-top:10px;color:#b9ffc8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#10141b}.item img{width:100%;display:block;background:#000;aspect-ratio:1/1;object-fit:contain}.meta{padding:10px;font-size:13px;color:#ccd3de;line-height:1.45}
.badge{display:inline-block;background:#252c38;border-radius:999px;padding:3px 8px;margin-right:5px}.small{font-size:12px;color:#8e98a7;margin-top:8px}
.range{margin-top:12px}.range label{display:flex;justify-content:space-between;color:#d9deea;font-size:14px}.range input{width:100%}
@media(max-width:700px){.ratios{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<h1>📸 Queena 智慧批次剪裁 v4</h1>
<p>這版改成「<strong>辨識黑底本身的顏色</strong>」再找內容，不會把 JPEG 壓縮後的深灰黑底誤認成圖片。</p>

<div class="card">
<label class="pick" for="files">＋ 選擇多張截圖</label>
<input id="files" type="file" accept="image/*" multiple>

<div class="tip" style="margin-top:12px">
<strong>你的這種截圖：</strong>選「智慧去黑邊」就好。<br>
它會把中間圖片上下的黑色空白裁掉，<strong>不會硬裁內容</strong>。如果某些圖黑邊還剩一點，可把「去黑邊強度」往右拉。
</div>

<div class="modes">
  <div class="opt active" data-mode="smart">✨ 智慧去黑邊</div>
  <div class="opt" data-mode="fit">完整放入指定比例</div>
</div>

<div class="range">
  <label><span>去黑邊強度</span><strong id="strengthLabel">標準</strong></label>
  <input id="strength" type="range" min="1" max="3" step="1" value="2">
</div>

<div class="ratios">
  <div class="opt active" data-ratio="16:9">16:9</div>
  <div class="opt" data-ratio="1:1">1:1 正方形</div>
  <div class="opt" data-ratio="9:16">9:16</div>
  <div class="opt" data-ratio="4:5">4:5</div>
  <div class="opt" data-ratio="3:4">3:4</div>
</div>

<div class="actions">
<button id="process" disabled>開始處理</button>
<button id="download" class="alt" disabled>下載全部 ZIP</button>
<button id="clear" class="alt">清空</button>
</div>
<div id="status" class="status"></div>
<div class="small">原圖不會覆蓋。新圖會另外輸出。</div>
</div>

<div class="card"><strong>處理結果</strong><div id="grid" class="grid" style="margin-top:12px"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const filesEl=$('#files'),processBtn=$('#process'),downloadBtn=$('#download'),clearBtn=$('#clear'),grid=$('#grid'),statusEl=$('#status');
let files=[],outputs=[],mode='smart',ratio='16:9';

document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{
 document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active')); el.classList.add('active'); mode=el.dataset.mode;
});
document.querySelectorAll('[data-ratio]').forEach(el=>el.onclick=()=>{
 document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('active')); el.classList.add('active'); ratio=el.dataset.ratio;
});

const strength=$('#strength'), strengthLabel=$('#strengthLabel');
const labels={1:'寬鬆',2:'標準',3:'較強'};
strength.oninput=()=>strengthLabel.textContent=labels[strength.value];

filesEl.onchange=()=>{files=[...filesEl.files];outputs=[];grid.innerHTML='';processBtn.disabled=!files.length;downloadBtn.disabled=true;statusEl.textContent=`已選 ${files.length} 張`;};
clearBtn.onclick=()=>{files=[];outputs=[];filesEl.value='';grid.innerHTML='';statusEl.textContent='已清空';processBtn.disabled=true;downloadBtn.disabled=true;};

function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>res({img,url});img.onerror=rej;img.src=url;});}
function parseRatio(s){const [w,h]=s.split(':').map(Number);return{w,h,val:w/h};}

function median(a){const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]||0;}
function colorDist(r,g,b,br,bg,bb){return Math.sqrt((r-br)**2+(g-bg)**2+(b-bb)**2);}

/* 核心：先估算截圖周圍黑底的實際顏色，再找「與背景顏色明顯不同」的最大連續區 */
function detectContentBand(src){
 const W=Math.min(420,src.width),H=Math.min(1000,src.height);
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(src,0,0,src.width,src.height,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data;

 // 用左右邊緣 + 上下中段多點估算黑底，不假設一定是純 #000
 const samples=[];
 const ys=[.08,.18,.30,.50,.70,.82,.92].map(v=>Math.floor(H*v));
 const xs=[.02,.04,.96,.98].map(v=>Math.floor(W*v));
 for(const yy of ys) for(const xx of xs){
   const i=(yy*W+xx)*4; samples.push([d[i],d[i+1],d[i+2]]);
 }
 const br=median(samples.map(v=>v[0])), bg=median(samples.map(v=>v[1])), bb=median(samples.map(v=>v[2]));

 const s=Number(strength.value);
 const distTh={1:24,2:34,3:44}[s];
 const rowNeed={1:.12,2:.20,3:.28}[s];

 const rowScore=new Array(H).fill(0);
 const left=Math.floor(W*.03),right=Math.floor(W*.97);
 for(let y=0;y<H;y++){
   let diff=0,total=0;
   for(let xx=left;xx<right;xx+=2){
     const i=(y*W+xx)*4;
     if(colorDist(d[i],d[i+1],d[i+2],br,bg,bb)>distTh) diff++;
     total++;
   }
   rowScore[y]=diff/total;
 }

 // 平滑，避免文字/細線造成斷裂
 const sm=rowScore.map((_,y)=>{
   let sum=0,n=0;
   for(let k=Math.max(0,y-4);k<=Math.min(H-1,y+4);k++){sum+=rowScore[k];n++;}
   return sum/n;
 });

 let active=sm.map(v=>v>rowNeed);

 // 內容內的小黑縫補起來，但大的黑條不補
 const maxGap=Math.max(4,Math.round(H*.018));
 let i=0;
 while(i<H){
   if(active[i]){i++;continue;}
   const a=i; while(i<H&&!active[i]) i++; const b=i-1;
   if(a>0&&i<H&&(b-a+1)<=maxGap) for(let k=a;k<=b;k++) active[k]=true;
 }

 // 找最大連續內容區，並偏好畫面中段
 const seg=[];
 i=0;
 while(i<H){
   if(!active[i]){i++;continue;}
   const a=i; while(i<H&&active[i]) i++; const b=i-1;
   const len=b-a+1,center=(a+b)/2/H;
   const avg=sm.slice(a,b+1).reduce((q,v)=>q+v,0)/len;
   const score=len*(.7+.3*avg)*(1-.12*Math.abs(center-.5));
   if(len>H*.04) seg.push({a,b,len,score});
 }
 if(!seg.length) return {y:0,h:src.height};
 seg.sort((a,b)=>b.score-a.score);
 let best=seg[0];

 // 只留很小安全邊，不再保留大段黑邊
 const pad=Math.max(1,Math.round(H*.002));
 best.a=Math.max(0,best.a-pad);best.b=Math.min(H-1,best.b+pad);
 const y=Math.round(best.a/H*src.height);
 const end=Math.round((best.b+1)/H*src.height);
 return {y,h:Math.max(1,end-y)};
}

async function makeOne(file){
 const {img,url}=await loadImage(file);
 const src=document.createElement('canvas');src.width=img.naturalWidth;src.height=img.naturalHeight;
 src.getContext('2d').drawImage(img,0,0);

 const band=detectContentBand(src);
 const sx=0,sy=band.y,sw=src.width,sh=band.h;
 const out=document.createElement('canvas');
 let suffix='smart';

 if(mode==='smart'){
   out.width=sw;out.height=sh;
   out.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,sw,sh);
 }else{
   const r=parseRatio(ratio);
   let ow=sw,oh=Math.round(sw/r.val);
   if(oh<sh){oh=sh;ow=Math.round(sh*r.val);}
   out.width=ow;out.height=oh;
   const ctx=out.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,ow,oh);
   const scale=Math.min(ow/sw,oh/sh),dw=Math.round(sw*scale),dh=Math.round(sh*scale);
   ctx.drawImage(src,sx,sy,sw,sh,Math.round((ow-dw)/2),Math.round((oh-dh)/2),dw,dh);
   suffix='fit_'+ratio.replace(':','x');
 }

 const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.97));URL.revokeObjectURL(url);
 const base=file.name.replace(/\.[^.]+$/,'');
 return{blob,name:`${base}_${suffix}.jpg`,ow:out.width,oh:out.height,sw:img.naturalWidth,sh:img.naturalHeight};
}

function addCard(o){
 const u=URL.createObjectURL(o.blob),div=document.createElement('div');div.className='item';
 div.innerHTML=`<img src="${u}"><div class="meta"><span class="badge">${mode==='smart'?'智慧去黑邊':'完整保留 '+ratio}</span><br><strong>${o.name}</strong><br>原圖：${o.sw} × ${o.sh}<br>新圖：${o.ow} × ${o.oh}</div>`;
 grid.appendChild(div);
}

processBtn.onclick=async()=>{
 outputs=[];grid.innerHTML='';processBtn.disabled=true;downloadBtn.disabled=true;
 for(let i=0;i<files.length;i++){statusEl.textContent=`處理中 ${i+1}/${files.length}…`;try{const o=await makeOne(files[i]);outputs.push(o);addCard(o);}catch(e){console.error(e);}}
 statusEl.textContent=`完成 ✅ ${outputs.length} 張；原圖未覆蓋`;processBtn.disabled=false;downloadBtn.disabled=!outputs.length;
};

const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(a){let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
async function zip(fs){
 const enc=new TextEncoder(),L=[],C=[];let off=0;
 for(const f of fs){const data=new Uint8Array(await f.blob.arrayBuffer()),name=enc.encode(f.name),crc=crc32(data);
  const l=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name,...data]);L.push(l);
  const c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...name]);C.push(c);off+=l.length;}
 const cs=C.reduce((a,b)=>a+b.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(fs.length),...u16(fs.length),...u32(cs),...u32(off),...u16(0)]);
 return new Blob([...L,...C,end],{type:'application/zip'});
}
downloadBtn.onclick=async()=>{statusEl.textContent='正在打包…';const b=await zip(outputs),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Queena_智慧去黑邊.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);statusEl.textContent='ZIP 已下載 ✅';};
</script>
</body></html>
