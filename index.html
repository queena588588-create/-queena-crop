<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queena 批次手動剪裁工具</title>
<style>
:root{
  --bg:#0e1117;--card:#171b24;--line:#2c3340;--accent:#8b6cff;
  --txt:#fff;--sub:#b8c0cc;--ok:#baffc9;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt)}
.wrap{max-width:980px;margin:auto;padding:16px}
h1{font-size:27px;margin:4px 0 8px}
p{color:var(--sub);line-height:1.55;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.pick,button{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700}
.pick{display:flex;justify-content:center;background:#fff;color:#111;cursor:pointer}
input[type=file]{display:none}
.ratios{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:12px}
.opt{background:#11151d;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;font-weight:700;cursor:pointer}
.opt.active{background:var(--accent)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button{background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:#28303c}
button:disabled{opacity:.45;cursor:not-allowed}
.tip{background:#10151d;border:1px solid #303848;border-radius:12px;padding:12px;color:#d7dce5;line-height:1.5;font-size:14px}
.stage-wrap{margin-top:14px;display:none}
.stage-title{font-size:14px;color:#d8deea;margin-bottom:8px}
.stage{
  position:relative; width:100%; max-width:760px; margin:auto;
  background:#000; border-radius:14px; overflow:hidden; touch-action:none;
  border:1px solid var(--line);
}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.crop{
  position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.56);
  cursor:move;touch-action:none;
}
.handle{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl{left:-11px;top:-11px}.tr{right:-11px;top:-11px}.bl{left:-11px;bottom:-11px}.br{right:-11px;bottom:-11px}
.info{font-size:13px;color:#cbd2de;line-height:1.5;margin-top:10px}
.status{min-height:22px;margin-top:10px;color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.item{background:#10141b;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item img{width:100%;display:block;background:#000;aspect-ratio:1/1;object-fit:contain}
.meta{padding:10px;font-size:13px;color:#ccd3de;line-height:1.45}
.badge{display:inline-block;background:#252c38;border-radius:999px;padding:3px 8px;margin-right:5px}
.small{font-size:12px;color:#8e98a7;margin-top:8px}
@media(max-width:760px){.ratios{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>✂️ Queena 批次手動剪裁</h1>
<p>第一張照片自己拉框，確認要留下的範圍，再把同一個框套用到全部照片。<strong>原圖不會覆蓋</strong>。</p>

<div class="card">
  <label class="pick" for="files">＋ 選擇多張照片 / 截圖</label>
  <input id="files" type="file" accept="image/*" multiple>

  <div class="tip" style="margin-top:12px">
    <strong>使用方式：</strong><br>
    1. 一次選很多張同尺寸截圖。<br>
    2. 用第一張拉好裁切框。<br>
    3. 可選自由裁切，或鎖定 16:9、1:1、9:16、4:5、3:4。<br>
    4. 按「套用全部並剪裁」。
  </div>

  <div class="ratios">
    <div class="opt active" data-ratio="free">自由</div>
    <div class="opt" data-ratio="16:9">16:9</div>
    <div class="opt" data-ratio="1:1">1:1</div>
    <div class="opt" data-ratio="9:16">9:16</div>
    <div class="opt" data-ratio="4:5">4:5</div>
    <div class="opt" data-ratio="3:4">3:4</div>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage-title">第一張預覽：拖曳白框，四個圓點可調整大小</div>
    <div class="stage" id="stage">
      <img id="preview" alt="">
      <div class="crop" id="crop">
        <div class="handle tl" data-handle="tl"></div>
        <div class="handle tr" data-handle="tr"></div>
        <div class="handle bl" data-handle="bl"></div>
        <div class="handle br" data-handle="br"></div>
      </div>
    </div>
    <div class="info" id="cropInfo"></div>
  </div>

  <div class="actions">
    <button id="process" disabled>套用全部並剪裁</button>
    <button id="reset" class="alt" disabled>重設裁切框</button>
    <button id="download" class="alt" disabled>下載全部 ZIP</button>
    <button id="clear" class="alt">清空</button>
  </div>

  <div id="status" class="status"></div>
  <div class="small">若不同照片原始尺寸不同，工具會依比例換算同一個裁切位置，不會直接用固定像素硬切。</div>
</div>

<div class="card">
  <strong>處理結果</strong>
  <div id="grid" class="grid"></div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const filesEl=$('#files'),stageWrap=$('#stageWrap'),stage=$('#stage'),preview=$('#preview'),crop=$('#crop');
const processBtn=$('#process'),resetBtn=$('#reset'),downloadBtn=$('#download'),clearBtn=$('#clear'),grid=$('#grid'),statusEl=$('#status'),cropInfo=$('#cropInfo');
let files=[],outputs=[],firstImg=null,ratioMode='free';
let box={x:.05,y:.10,w:.90,h:.80}; // normalized
let dragState=null;

document.querySelectorAll('[data-ratio]').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    ratioMode=el.dataset.ratio;
    if(firstImg) applyRatioToBox();
  };
});

function ratioValue(){
  if(ratioMode==='free') return null;
  const [w,h]=ratioMode.split(':').map(Number);
  return w/h;
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function renderBox(){
  crop.style.left=(box.x*100)+'%';
  crop.style.top=(box.y*100)+'%';
  crop.style.width=(box.w*100)+'%';
  crop.style.height=(box.h*100)+'%';
  if(firstImg){
    const px=Math.round(box.x*firstImg.naturalWidth);
    const py=Math.round(box.y*firstImg.naturalHeight);
    const pw=Math.round(box.w*firstImg.naturalWidth);
    const ph=Math.round(box.h*firstImg.naturalHeight);
    cropInfo.textContent=`第一張原圖 ${firstImg.naturalWidth} × ${firstImg.naturalHeight} ｜ 裁切範圍 x:${px}, y:${py}, ${pw} × ${ph}`;
  }
}

function applyRatioToBox(){
  const r=ratioValue();
  if(!r){renderBox();return;}
  const stageRect=stage.getBoundingClientRect();
  const imgRatio=firstImg.naturalWidth/firstImg.naturalHeight;
  // normalized width/height relation: (w*imgW)/(h*imgH)=r => w/h = r/imgRatio
  const normRatio=r/imgRatio;
  let w=box.w,h=w/normRatio;
  if(h>0.92){h=0.92;w=h*normRatio;}
  if(w>0.92){w=0.92;h=w/normRatio;}
  box.w=w;box.h=h;
  box.x=clamp(box.x,0,1-box.w);box.y=clamp(box.y,0,1-box.h);
  renderBox();
}

function resetBox(){
  box={x:.05,y:.10,w:.90,h:.80};
  applyRatioToBox();
}

function pointerNorm(e){
  const r=stage.getBoundingClientRect();
  return {
    x:clamp((e.clientX-r.left)/r.width,0,1),
    y:clamp((e.clientY-r.top)/r.height,0,1)
  };
}

crop.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=pointerNorm(e);
  const h=e.target.dataset.handle||'move';
  dragState={type:h,start:p,box:{...box}};
  crop.setPointerCapture(e.pointerId);
});

crop.addEventListener('pointermove',e=>{
  if(!dragState)return;
  const p=pointerNorm(e),dx=p.x-dragState.start.x,dy=p.y-dragState.start.y,b0=dragState.box;
  const min=.05;
  if(dragState.type==='move'){
    box.x=clamp(b0.x+dx,0,1-b0.w);
    box.y=clamp(b0.y+dy,0,1-b0.h);
  }else{
    let left=b0.x,top=b0.y,right=b0.x+b0.w,bottom=b0.y+b0.h;
    if(dragState.type.includes('l')) left=clamp(b0.x+dx,0,right-min);
    if(dragState.type.includes('r')) right=clamp(b0.x+b0.w+dx,left+min,1);
    if(dragState.type.includes('t')) top=clamp(b0.y+dy,0,bottom-min);
    if(dragState.type.includes('b')) bottom=clamp(b0.y+b0.h+dy,top+min,1);

    let w=right-left,h=bottom-top;
    const r=ratioValue();
    if(r){
      const imgRatio=firstImg.naturalWidth/firstImg.naturalHeight;
      const nr=r/imgRatio;
      if(dragState.type==='tl'){
        w=Math.max(min,w); h=w/nr; left=right-w; top=bottom-h;
      }else if(dragState.type==='tr'){
        w=Math.max(min,w); h=w/nr; right=left+w; top=bottom-h;
      }else if(dragState.type==='bl'){
        w=Math.max(min,w); h=w/nr; left=right-w; bottom=top+h;
      }else{
        w=Math.max(min,w); h=w/nr; right=left+w; bottom=top+h;
      }
      if(left<0){left=0;w=right;h=w/nr;top=bottom-h}
      if(top<0){top=0;h=bottom;w=h*nr;left=right-w}
      if(right>1){right=1;w=right-left;h=w/nr;bottom=top+h}
      if(bottom>1){bottom=1;h=bottom-top;w=h*nr;right=left+w}
    }
    box.x=clamp(left,0,1-min);box.y=clamp(top,0,1-min);
    box.w=clamp(right-left,min,1-box.x);box.h=clamp(bottom-top,min,1-box.y);
  }
  renderBox();
});

crop.addEventListener('pointerup',()=>dragState=null);
crop.addEventListener('pointercancel',()=>dragState=null);

function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>res({img,url}); img.onerror=rej; img.src=url;
  });
}

filesEl.onchange=async()=>{
  files=[...filesEl.files];outputs=[];grid.innerHTML='';downloadBtn.disabled=true;
  if(!files.length){stageWrap.style.display='none';processBtn.disabled=true;resetBtn.disabled=true;return;}
  const {img,url}=await loadImage(files[0]);
  firstImg=img; preview.src=url;
  preview.onload=()=>{
    stageWrap.style.display='block';
    resetBox();
    processBtn.disabled=false;resetBtn.disabled=false;
    statusEl.textContent=`已選 ${files.length} 張，請先調整第一張裁切框`;
  };
};

resetBtn.onclick=resetBox;
clearBtn.onclick=()=>{
  files=[];outputs=[];filesEl.value='';grid.innerHTML='';stageWrap.style.display='none';statusEl.textContent='已清空';
  processBtn.disabled=true;resetBtn.disabled=true;downloadBtn.disabled=true;firstImg=null;
};

async function cropFile(file,index){
  const {img,url}=await loadImage(file);
  const sx=Math.round(box.x*img.naturalWidth), sy=Math.round(box.y*img.naturalHeight);
  const sw=Math.max(1,Math.round(box.w*img.naturalWidth)), sh=Math.max(1,Math.round(box.h*img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=sw;canvas.height=sh;
  canvas.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.97));
  URL.revokeObjectURL(url);
  const base=file.name.replace(/\.[^.]+$/,'');
  const suffix=ratioMode==='free'?'free':ratioMode.replace(':','x');
  return {blob,name:`${base}_${suffix}.jpg`,ow:sw,oh:sh,sw:img.naturalWidth,sh:img.naturalHeight};
}

function addCard(o){
  const u=URL.createObjectURL(o.blob),div=document.createElement('div');div.className='item';
  div.innerHTML=`<img src="${u}"><div class="meta"><span class="badge">${ratioMode==='free'?'自由裁切':ratioMode}</span><br><strong>${o.name}</strong><br>原圖：${o.sw} × ${o.sh}<br>新圖：${o.ow} × ${o.oh}</div>`;
  grid.appendChild(div);
}

processBtn.onclick=async()=>{
  outputs=[];grid.innerHTML='';processBtn.disabled=true;downloadBtn.disabled=true;
  for(let i=0;i<files.length;i++){
    statusEl.textContent=`處理中 ${i+1}/${files.length}…`;
    try{const o=await cropFile(files[i],i);outputs.push(o);addCard(o);}catch(e){console.error(e);}
  }
  statusEl.textContent=`完成 ✅ ${outputs.length} 張；原圖未覆蓋`;
  processBtn.disabled=false;downloadBtn.disabled=!outputs.length;
};

// ZIP
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(a){let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
async function zip(fs){
 const enc=new TextEncoder(),L=[],C=[];let off=0;
 for(const f of fs){const data=new Uint8Array(await f.blob.arrayBuffer()),name=enc.encode(f.name),crc=crc32(data);
  const l=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name,...data]);L.push(l);
  const c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...name]);C.push(c);off+=l.length;}
 const cs=C.reduce((a,b)=>a+b.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(fs.length),...u16(fs.length),...u32(cs),...u32(off),...u16(0)]);
 return new Blob([...L,...C,end],{type:'application/zip'});
}
downloadBtn.onclick=async()=>{
  statusEl.textContent='正在打包 ZIP…';
  const b=await zip(outputs),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='Queena_批次剪裁.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);
  statusEl.textContent='ZIP 已下載 ✅';
};
</script>
</body>
</html>
